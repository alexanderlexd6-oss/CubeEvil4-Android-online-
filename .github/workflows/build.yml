name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar NDK r28c y herramientas
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Compilar el nucleo del juego
        run: bash port/tools/whole_build_android.sh

      - name: Compilar el APK
        working-directory: port/android-decomp
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleCoreDebug; else gradle assembleCoreDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-apk
          path: port/android-decomp/app/build/outputs/apk/**/*.apk
